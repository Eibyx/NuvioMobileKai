name: Kai Debug Build

on:
  push:
    branches: [kai]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kai-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

          # Sign with the fixed release key so each debug APK installs over the previous one.
          # Without it the runner's throwaway debug key would change on every build.
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && grep -Eq '^NUVIO_RELEASE_KEY_ALIAS=.+' local.properties; then
            keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "$keystore_path" >> local.properties
            echo "SIGNING_ARGS=-Pnuvio.android.signDebugWithRelease=true" >> "$GITHUB_ENV"
          else
            echo "::warning::NUVIO_RELEASE_KEYSTORE_BASE64 is not set; this APK uses a one-off debug key and will not install over earlier builds."
          fi

      # The seek-bar thumbnails are Rust (native/); only arm64-v8a is built, like the APK.
      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      # Only 64-bit ARM, like the release: a smaller APK and a faster build.
      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pnuvio.android.abis=arm64-v8a ${SIGNING_ARGS:-} --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-kai-full-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 14
