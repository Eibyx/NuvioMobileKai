name: Secret Patterns

# Fails when a tracked file holds something shaped like a private credential, real or invented:
# GitHub secret scanning flags both in a public repository. Test values must be built at run time
# instead (see DiagnosticsRedactorTest). Client-side keys meant to ship in the app (the Supabase
# anon key) are JWTs and are not matched here.

on:
  pull_request:
  push:
    branches: [kai]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for credential-shaped literals
        run: |
          patterns=(
            'AIza[0-9A-Za-z_-]{35}'                       # Google API key
            'gh[pousr]_[0-9A-Za-z]{36}'                   # GitHub token
            'github_pat_[0-9A-Za-z_]{40,}'                # GitHub fine-grained token
            'AKIA[0-9A-Z]{16}'                            # AWS access key id
            'xox[abprs]-[0-9A-Za-z-]{10,}'                # Slack token
            'sk-(ant-|proj-)?[A-Za-z0-9_-]{32,}'          # OpenAI / Anthropic key
            'sk_live_[0-9A-Za-z]{20,}'                    # Stripe live key
            'ya29\.[0-9A-Za-z_-]{20,}'                    # Google OAuth access token
            '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----'       # private key
          )
          found=0
          for pattern in "${patterns[@]}"; do
            # Only file and line: the match itself is never printed.
            hits=$(git grep -nIE -- "$pattern" | cut -d: -f1,2 || true)
            if [ -n "$hits" ]; then
              echo "::error::Credential-shaped text ($pattern) in:"
              echo "$hits"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "Remove it, or build test values at run time so no literal matches."
            exit 1
          fi
          echo "No credential-shaped literals found."
