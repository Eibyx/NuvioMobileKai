name: Build Mobile Release
run-name: ${{ inputs.description != '' && format('Build Mobile Release - {0}', inputs.description) || 'Build Mobile Release' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - test-build
          - draft
          - publish
        default: dry-run
      target:
        description: Choose which platform to build
        required: true
        type: choice
        options:
          - all
          - android-only
          - ios-only
        default: all
      description:
        description: Run description
        required: false
        type: string
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string
      notes_from:
        description: Optional commit to start the release notes after (default - the previous release tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.mode }} release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/Eibyx/NuvioMobileKai/contributors?per_page=100

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KAI_BRANCH: kai
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi
          if [[ "${RELEASE_MODE}" == "draft" || "${RELEASE_MODE}" == "publish" ]]; then
            if [[ "${RELEASE_BRANCH}" != "${DEFAULT_BRANCH}" && "${RELEASE_BRANCH}" != "${KAI_BRANCH}" ]]; then
              echo "Mode '${RELEASE_MODE}' creates a tag, so it must be dispatched from ${KAI_BRANCH} or the default branch (${DEFAULT_BRANCH})." >&2
              echo "Use mode 'test-build' to build '${RELEASE_BRANCH}' without tagging." >&2
              exit 1
            fi
          else
            echo "Mode '${RELEASE_MODE}' on branch '${RELEASE_BRANCH}': no tag or release will be created."
          fi

          if [[ "${RELEASE_MODE}" != "test-build" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/(mobile-release|update-store-source)\.yml|\.github/release-notes/[^/]+\.md|store\.json|scripts/(build-ios-ipa|generate-release-notes|prepare-ios-dependencies|release-metadata)\.sh|scripts/update-store-source\.py)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

          if [[ "${RELEASE_MODE}" != "dry-run" ]]; then
            required_secrets=(
              RELEASE_PROPERTIES_BASE64
              RELEASE_KEYSTORE_BASE64
            )
            missing=()
            for secret_name in "${required_secrets[@]}"; do
              if [[ -z "${!secret_name}" ]]; then
                missing+=("${secret_name}")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          PREVIOUS_VERSION: ${{ steps.release.outputs.previous_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          NOTES_FROM: ${{ inputs.notes_from }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_URL: https://github.com/NuvioMedia/NuvioMobile.git
          UPSTREAM_BRANCH: cmp-rewrite
          ENHANCED_URL: https://github.com/luqmanfadlli/NuvioMobile-Enhanced.git
          ENHANCED_BRANCH: enhanced
        run: |
          notes_to="${GITHUB_SHA}"
          notes_from="$(printf '%s' "${NOTES_FROM}" | tr -d '[:space:]')"
          if [[ -n "${notes_from}" ]]; then
            if ! git cat-file -e "${notes_from}^{commit}" 2>/dev/null; then
              echo "notes_from commit not found: ${notes_from}" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${notes_from}" "${notes_to}"; then
              echo "notes_from ${notes_from} is not an ancestor of ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            echo "Release notes start after the given commit ${notes_from}."
          else
            # Start after the last published release, so earlier releases' commits are not repeated:
            # the previous version's tag, else the newest release tag on this branch. The store
            # publish commits on this branch come from upstream and are far older than Kai's releases.
            git fetch --tags --force --quiet origin || echo "::warning::Could not fetch tags."
            previous_tag="${PREVIOUS_VERSION%-beta}-beta"
            latest_tag="$(git tag --merged "${notes_to}" --sort=-creatordate --list '*-beta' | grep -vxF "${RELEASE_TAG}" | head -n 1 || true)"
            if [[ -n "${PREVIOUS_VERSION}" ]] && git rev-parse --verify --quiet "refs/tags/${previous_tag}" >/dev/null \
              && git merge-base --is-ancestor "${previous_tag}" "${notes_to}"; then
              notes_from="$(git rev-parse "${previous_tag}^{commit}")"
              echo "Release notes start after the previous release ${previous_tag} (${notes_from})."
            elif [[ -n "${latest_tag}" ]]; then
              notes_from="$(git rev-parse "${latest_tag}^{commit}")"
              echo "Release notes start after the latest release tag on this branch, ${latest_tag} (${notes_from})."
            else
              notes_from="${PREVIOUS_BUMP}"
              echo "No release tag on this branch; starting after the previous version bump ${notes_from}."
            fi
          fi

          exclude_ref_args=()
          if git fetch --no-tags --quiet "${UPSTREAM_URL}" "${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"; then
            exclude_ref_args+=(--exclude-ref "refs/remotes/upstream/${UPSTREAM_BRANCH}")
          else
            echo "::warning::Could not fetch upstream; release notes may include upstream commits."
          fi
          # Kai is built on luqmanfadlli's Enhanced fork; its commits are not Kai's to announce.
          if git fetch --no-tags --quiet "${ENHANCED_URL}" "${ENHANCED_BRANCH}:refs/remotes/enhanced/${ENHANCED_BRANCH}"; then
            exclude_ref_args+=(--exclude-ref "refs/remotes/enhanced/${ENHANCED_BRANCH}")
          else
            echo "::warning::Could not fetch Nuvio Enhanced; release notes may include its commits."
          fi

          ./scripts/generate-release-notes.sh \
            --from "${notes_from}" \
            --to "${notes_to}" \
            --repository "${GITHUB_REPOSITORY}" \
            --exclude "${EXCLUDE_COMMITS}" \
            "${exclude_ref_args[@]}" \
            > generated-notes.md

          # A hand-written summary in .github/release-notes/<version>.md leads the notes when present.
          summary_file=".github/release-notes/${RELEASE_VERSION}.md"
          if [[ -s "${summary_file}" ]]; then
            {
              cat "${summary_file}"
              if [[ -s generated-notes.md ]]; then
                printf '\n### Commits\n\n'
                cat generated-notes.md
              fi
            } > release-notes.md
          else
            mv generated-notes.md release-notes.md
          fi

          if [[ ! -s release-notes.md ]]; then
            echo "No release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  android:
    name: Build Android APKs
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'android-only')
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      # Kai ships one APK, for 64-bit ARM phones.
      RELEASE_ABI: arm64-v8a
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/Eibyx/NuvioMobileKai/contributors?per_page=100

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        run: |
          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties
          if [[ -n "${CONTRIBUTIONS_URL}" ]]; then
            printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties
          fi

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done
          # Kai ships without its own Trakt and Simkl apps until they are registered.
          optional_properties=(
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            SIMKL_CLIENT_ID
          )
          for property_name in "${optional_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "::warning::${property_name} is not set; that integration is disabled in this build."
            fi
          done

      - name: Build full release APKs
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.versionName="${RELEASE_VERSION}" -Pnuvio.android.abis="${RELEASE_ABI}" --stacktrace

      # The in-app updater picks the asset whose name contains the device ABI (arm64-v8a, ...).
      - name: Name APKs for the updater
        run: |
          apk_dir=androidApp/build/outputs/apk/full/release
          mkdir -p release-apks
          shopt -s nullglob
          apks=("${apk_dir}"/*.apk)
          apk="${apk_dir}/androidApp-full-${RELEASE_ABI}-release.apk"
          if (( ${#apks[@]} != 1 )) || [[ "${apks[0]}" != "${apk}" ]]; then
            echo "Expected only the signed ${RELEASE_ABI} APK in ${apk_dir}:" >&2
            ls -l "${apk_dir}" >&2 || true
            exit 1
          fi
          cp "${apk}" "release-apks/NuvioKai-${RELEASE_VERSION}-${RELEASE_ABI}.apk"
          ls -l release-apks

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ needs.prepare.outputs.version }}-android-full-release
          path: release-apks/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'ios-only')
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx1024M
      NUVIO_GRADLE_JVMARGS: -Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M -XX:+UseG1GC
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx9216M -XX:+UseG1GC
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      CONTRIBUTIONS_URL: ${{ secrets.CONTRIBUTIONS_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          if [[ -n "${CONTRIBUTIONS_URL}" ]]; then
            printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties
          fi

      - name: Constrain Gradle memory for the hosted runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
            echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
            echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "kotlin.native.disableCompilerDaemon=true"
          } >> "${gradle_user_home}/gradle.properties"
          cat "${gradle_user_home}/gradle.properties"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh "${{ needs.prepare.outputs.version }}"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ needs.prepare.outputs.version }}-ios-full-release
          path: build/ios-ipa/*.ipa
          if-no-files-found: error

  release:
    name: Create ${{ inputs.mode }} release
    # always() lets the release go ahead when one platform was skipped by the target choice.
    if: >-
      always()
      && (inputs.mode == 'draft' || inputs.mode == 'publish')
      && needs.prepare.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.android.result)
      && contains(fromJSON('["success","skipped"]'), needs.ios.result)
    needs:
      - prepare
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      RELEASE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        run: |
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipa' \) -print | sort)
          if (( ${#release_files[@]} == 0 )); then
            echo "No release packages were produced." >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --target "${RELEASE_BRANCH}"
            --title "${RELEASE_VERSION}"
            --notes-file release-assets/release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create "${release_args[@]}" "${release_files[@]}"
